name: Build Sync Player APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select build type to produce'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🔧 Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: ⚙️ Prepare Environment & Configuration
        run: |
          echo "Setting up environment configuration..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env file"
            fi
          fi

      - name: 🔐 Prepare Signing Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Preparing Debug keystore..."
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 -D debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore successfully"
          fi

          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Preparing Release keystore..."
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "No custom release keystore secret found; creating self-signed key for release build..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -storepass "${STORE_PASSWORD:-android}" \
              -alias "upload" \
              -keypass "${KEY_PASSWORD:-android}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Sync Player,OU=Traxxion Tech,O=Traxxion,L=Harare,C=ZW"
          fi

      - name: 🔨 Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' }}
        run: |
          echo "Starting assembleDebug build..."
          ./gradlew assembleDebug --stacktrace

      - name: 🚀 Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          echo "Starting assembleRelease build..."
          ./gradlew assembleRelease --stacktrace

      - name: 📊 Inspect Generated APKs & Compute Checksums
        run: |
          echo "### 📦 Generated Android Packages" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | File Name | Size | SHA256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          for apk in $(find app/build/outputs/apk -type f -name "*.apk"); do
            NAME=$(basename "$apk")
            SIZE=$(du -h "$apk" | cut -f1)
            SHA=$(sha256sum "$apk" | cut -d' ' -f1)
            echo "| Android APK | \`$NAME\` | $SIZE | \`$SHA\` |" >> $GITHUB_STEP_SUMMARY
            echo "Found APK: $apk ($SIZE, SHA256: $SHA)"
          done

      - name: 📤 Upload Debug APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: SyncPlayer-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📤 Upload Release APK Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: SyncPlayer-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
          
